<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elparte</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Previsión meteorológica detallada por horas en tiempo real">
  <meta name="theme-color" content="#2563eb" id="themeColorMeta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="elparte">

  <!-- Detección de tema oscuro sin parpadeo (Anti-FOUC) -->
  <script>
    (function() {
      const saved = localStorage.getItem('elparte_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1>
        <img src="icons/icon.svg" class="brand-icon" width="36" height="36" alt="" aria-hidden="true">
        <span class="brand-title"><span class="brand-el">el</span><span class="brand-parte">parte</span></span>
      </h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="select-wrap">
        <select id="lugar" aria-label="Seleccionar ubicación">
          <option value="murcia">Murcia</option>
          <option value="pozo">Pozo del Esparto</option>
          <option value="puerto">Puerto Lumbreras</option>
        </select>
      </div>
    </div>

    <section class="card compact-card">
      <div class="compact-head">
        <span class="title">Próximas 24 horas</span>
      </div>
      <div id="summary" class="compact-summary"></div>
    </section>

    <div id="forecast"></div>
  </div>

  <!-- Lógica de la aplicación -->
  <script src="app.js" defer></script>
</body>
</html>
