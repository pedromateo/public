<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>elparte</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Previsión meteorológica detallada por horas en tiempo real">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="elparte">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>
      <span class="icon-svg" style="display:inline-flex">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="4" fill="#f59e0b"/>
          <path d="M7 19h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.8A3.5 3.5 0 0 0 7 19z" fill="#94a3b8" fill-opacity="0.9" stroke="#fff" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="brand-title"><span class="brand-el">el</span><span class="brand-parte">parte</span></span>
    </h1>

    <div class="toolbar">
      <div class="select-wrap">
        <select id="lugar" aria-label="Seleccionar ubicación">
          <option value="murcia">Murcia</option>
          <option value="pozo">Pozo del Esparto (Cuevas del Almanzora)</option>
          <option value="puerto">Puerto Lumbreras</option>
        </select>
      </div>
      <span id="status" class="status">Cargando…</span>
    </div>

    <section class="card compact-card">
      <div class="compact-head">
        <span class="title">Próximas 24 horas</span>
        <span id="summarySubtitle" class="compact-subtitle">Desde la hora actual</span>
      </div>
      <div id="summary" class="compact-summary"></div>
    </section>

    <div id="forecast"></div>
  </div>

  <!-- Lógica de la aplicación -->
  <script src="app.js" defer></script>
</body>
</html>
