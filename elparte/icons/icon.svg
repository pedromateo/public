<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Sky Gradient matching elparte theme -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Warm Golden Sun Gradient -->
    <linearGradient id="sun" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Minimalist Cloud Gradient -->
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Refined Soft Elevation Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c4a6e" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Round Circular Background -->
  <circle cx="256" cy="256" r="256" fill="url(#sky)"/>

  <g transform="translate(-14, 28)">
    <!-- Minimalist Sun -->
    <circle cx="340" cy="174" r="82" fill="url(#sun)"/>

    <!-- Minimalist Cloud -->
    <path filter="url(#cloudShadow)" fill="url(#cloud)" d="
      M 148 354
      C 114 354, 88 328, 88 294
      C 88 262, 110 236, 142 232
      C 148 188, 185 154, 232 154
      C 265 154, 294 170, 308 196
      C 320 188, 336 184, 354 184
      C 390 184, 420 211, 422 246
      C 442 254, 456 274, 456 300
      C 456 330, 430 354, 400 354
      Z
    "/>
  </g>
</svg>