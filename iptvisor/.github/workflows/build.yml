name: Android CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and lint
        run: gradle testDebugUnitTest lintDebug --stacktrace

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Release APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          export KEYSTORE_FILE="$PWD/release.jks"
          gradle assembleRelease --stacktrace

      - name: Build Debug APK
        if: steps.signing.outputs.has_keystore != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Verify APK installability and signature
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Verifying APK: $APK_PATH"
          test -f "$APK_PATH"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | head -n 25
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
          mkdir -p dist
          if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
            cp "$APK_PATH" dist/IPTVisor-release.apk
          else
            cp "$APK_PATH" dist/IPTVisor-debug.apk
          fi

      - name: Publish direct APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iptvisor-latest-apk
          name: "IPTVisor APK (Última versión)"
          body: |
            APK compilada automáticamente por GitHub Actions (descarga directa sin ZIP).
            - Commit: `${{ github.sha }}`
            - Rama: `${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: dist/*.apk
