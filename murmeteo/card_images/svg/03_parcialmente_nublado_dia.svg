<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="partlyCloudyDaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46A0E6"/>
      <stop offset="100%" stop-color="#7CC2F4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#partlyCloudyDaySky)"/>
  <!-- Sun -->
  <circle cx="900" cy="200" r="80" fill="#FFCC00"/>
  <!-- Cloud 1 (Left) -->
  <g fill="#FFFFFF" opacity="0.85" transform="translate(180, 160) scale(0.85)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
  <!-- Cloud 2 (Front of Sun) -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(710, 240) scale(1.15)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
</svg>
