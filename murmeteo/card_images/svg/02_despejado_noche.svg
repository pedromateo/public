  </defs>
  <rect width="1200" height="660" fill="url(#nightSky)"/>
  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="180" cy="120" r="3"/>
    <circle cx="320" cy="80" r="2"/>
    <circle cx="540" cy="160" r="3"/>
    <circle cx="720" cy="90" r="2"/>
    <circle cx="850" cy="140" r="4"/>
    <circle cx="1050" cy="110" r="3"/>
    <circle cx="1120" cy="260" r="2"/>
    <circle cx="250" cy="280" r="2"/>
    <circle cx="640" cy="290" r="2"/>
    <circle cx="800" cy="350" r="3"/>
    <circle cx="980" cy="420" r="2"/>
  </g>
  <!-- Crescent Moon -->
  <circle cx="960" cy="210" r="75" fill="#F1F5F9" mask="url(#moonCutout)" opacity="0.95"/>
</svg>