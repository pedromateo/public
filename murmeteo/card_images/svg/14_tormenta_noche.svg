<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="stormNightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#151E2E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#stormNightSky)"/>
  <!-- Dark Storm Cloud (Left) -->
  <g fill="#243044" opacity="0.75" transform="translate(130, 150) scale(0.95)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
  <!-- Main Storm Cloud (Right) -->
  <g fill="#2D3C53" opacity="0.9" transform="translate(660, 160) scale(1.3)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
  <!-- Lightning Bolt (Bright and vibrant) -->
  <polygon points="905,310 882,395 902,395 849,492 868,415 848,415 890,310" fill="#FACC15"/>
  <!-- Raindrops -->
  <g stroke="#93C5FD" stroke-width="4" stroke-linecap="round" opacity="0.65">
    <line x1="775" y1="360" x2="769" y2="384"/>
    <line x1="755" y1="458" x2="749" y2="482"/>
    <line x1="965" y1="370" x2="959" y2="394"/>
    <line x1="945" y1="468" x2="939" y2="492"/>
    <line x1="1007" y1="438" x2="1001" y2="462"/>
  </g>
</svg>
