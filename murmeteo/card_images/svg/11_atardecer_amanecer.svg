<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E17055"/>
      <stop offset="100%" stop-color="#F9B09F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#sunsetSky)"/>
  <!-- Sun -->
  <circle cx="900" cy="420" r="120" fill="#FFEAA7"/>
  <!-- Cloud 1 (Left) -->
  <g fill="#FFFFFF" opacity="0.85" transform="translate(180, 180) scale(0.85)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
  <!-- Cloud 2 (Front of Sun) -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(670, 310) scale(1.15)">
    <circle cx="45" cy="0" r="45"/>
    <circle cx="105" cy="-15" r="60"/>
    <circle cx="175" cy="5" r="38"/>
    <rect x="20" y="-10" width="175" height="50" rx="25"/>
  </g>
</svg>
