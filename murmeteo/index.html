<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MurMeteo</title>
  
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/android/mipmap-xxxhdpi/ic_launcher.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/ios/Icon-App-60x60@3x.png">
  
  <link rel="stylesheet" href="./style.css">
  
  <script>
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW falló:', e));
      });
    }
  </script>
</head>
<body>

  <div id="error-overlay">
    <div class="error-card">
      <div class="error-icon">📡</div>
      <h3 id="error-title" class="error-title">Sin acceso a datos</h3>
      <p id="error-desc" class="error-desc">No ha sido posible acceder a los datos de la previsión meteorológica.</p>
      <button id="btn-retry" class="btn-retry">Reintentar</button>
    </div>
  </div>

  <div class="max-w-md">
    <header>
      <div class="header-content">
        <div id="header-title" class="header-title">
          <img src="./icons/android/mipmap-xxhdpi/ic_launcher.png" alt="MurMeteo Icon" class="header-logo">
          <span id="header-title-text">MurMeteo</span>
        </div>
        <div class="header-actions">
          <div id="header-badge" class="header-badge">Actualizando...</div>
          <button id="btn-share" class="btn-share" aria-label="Compartir" title="Compartir">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner">
      Sin conexión - Mostrando datos guardados
    </div>

    <div id="ptr-container">
      <div class="ptr-content">
        <svg id="ptr-icon" class="ptr-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
        <span id="ptr-text">Tira para refrescar</span>
      </div>
    </div>

    <main id="main-content">
      <div id="main-loader">
        <div class="loader-spinner"></div>
      </div>
      
      <div id="data-container" style="display: none;">
        <div class="top-card">
          <div id="top-location" class="top-card-location"><svg viewBox='0 0 24 24' width='16' height='16' stroke='currentColor' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' style='vertical-align: text-bottom;'><path d='M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z'></path><circle cx='12' cy='10' r='3'></circle></svg> Murcia</div>
          <div id="top-temp" class="top-card-temp">--°</div>
          <div id="top-desc" class="top-card-desc">--</div>
          <div class="top-card-stats">
            <span id="top-wind"><svg viewBox='0 0 24 24' width='16' height='16' stroke='currentColor' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' style='vertical-align: text-bottom;'><path d='M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2'></path></svg> -- km/h</span>
            <span id="top-minmax"><svg viewBox='0 0 24 24' width='16' height='16' stroke='currentColor' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' style='vertical-align: text-bottom;'><path d='M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z'></path></svg> --° / --°</span>
            <span id="top-sun"><svg viewBox='0 0 24 24' width='16' height='16' stroke='currentColor' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round' style='vertical-align: text-bottom;'><path d='M17 18a5 5 0 0 0-10 0'></path><line x1='12' y1='2' x2='12' y2='9'></line><line x1='4.22' y1='10.22' x2='5.64' y2='11.64'></line><line x1='1' y1='18' x2='3' y2='18'></line><line x1='21' y1='18' x2='23' y2='18'></line><line x1='18.36' y1='11.64' x2='19.78' y2='10.22'></line><line x1='23' y1='22' x2='1' y2='22'></line><polyline points='8 6 12 2 16 6'></polyline></svg> --:-- / --:--</span>
          </div>
        </div>

        <div id="hourly-list" class="hourly-list">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>

    <div id="pwa-prompt">
      <div id="pwa-text" class="pwa-text">Instala MurMeteo para un acceso más rápido</div>
      <button id="pwa-btn" class="pwa-btn">Añadir a Inicio</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./aemetService.js"></script>
  <script src="./app.js"></script>
</body>
</html>
