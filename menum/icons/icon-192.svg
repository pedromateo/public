<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#charcoalGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="rgba(249, 115, 22, 0.2)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="270" r="180" fill="url(#glowGrad)" />

  <!-- Cloche / Dish Dome -->
  <!-- Top handle -->
  <circle cx="256" cy="165" r="22" fill="url(#goldGrad)" />
  <path d="M246 182 H266 V195 H246 Z" fill="url(#goldGrad)" />

  <!-- Cloche Main Dome -->
  <path d="M 120 310 C 120 215 180 195 256 195 C 332 195 392 215 392 310 Z" fill="url(#flameGrad)" />

  <!-- Steam / Flavor Aroma Ribbons -->
  <path d="M 215 140 C 210 115 225 100 220 75" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 256 130 C 250 105 265 90 260 65" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.95" />
  <path d="M 297 140 C 292 115 307 100 302 75" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Cloche Rim Base -->
  <rect x="96" y="310" width="320" height="24" rx="12" fill="url(#goldGrad)" />

  <!-- Platter Plate Underneath -->
  <path d="M 80 344 C 110 380 402 380 432 344 Z" fill="url(#flameGrad)" opacity="0.9" />
  <line x1="64" y1="344" x2="448" y2="344" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Subtle Letter 'M' monogram on dome -->
  <path d="M 226 290 L 226 245 L 246 270 L 266 270 L 286 245 L 286 290" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" fill="none" />
</svg>
