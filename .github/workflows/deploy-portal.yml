name: Deploy Portal

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          mkdir -p dist/stoxxx dist/brainfit dist/loopp dist/mylanding dist/mschool dist/medit dist/sanz dist/menum dist/assets

          # Root Portal & Assets
          cp index.html dist/
          cp -r assets/* dist/assets/ 2>/dev/null || true
          touch dist/.nojekyll

          # STOXXX Copy
          if [ -d "stoxxx" ]; then
            echo "Packaging STOXXX..."
            cp -r stoxxx/index.html stoxxx/favicon* stoxxx/data stoxxx/reports dist/stoxxx/ 2>/dev/null || true
          fi

          # Brainfit Copy
          if [ -d "brainfit" ]; then
            echo "Packaging Brainfit..."
            cd brainfit
            cp index.html manifest.json sw.js config.json ../dist/brainfit/ 2>/dev/null || true
            cp -r css js assets ../dist/brainfit/ 2>/dev/null || true
            cd ..
          fi


          # Loopp Copy
          if [ -d "loopp" ]; then
            echo "Packaging Loopp..."
            cd loopp
            cp index.html manifest.json sw.js ../dist/loopp/ 2>/dev/null || true
            cp -r js icons ../dist/loopp/ 2>/dev/null || true
            cd ..
          fi

          # MyLanding Copy
          if [ -d "mylanding" ]; then
            echo "Packaging MyLanding..."
            cd mylanding
            cp index.html ../dist/mylanding/ 2>/dev/null || true
            cp -r index_files ../dist/mylanding/ 2>/dev/null || true
            cd ..
          fi


          # mSchool Copy
          if [ -d "mschool" ]; then
            echo "Packaging mSchool..."
            cd mschool
            cp index.html manifest.json sw.js icon-192.svg icon-512.svg juegos_estimulacion_movil.html ../dist/mschool/ 2>/dev/null || true
            cd ..
          fi

          # Medit Copy
          if [ -d "medit" ]; then
            echo "Packaging Medit..."
            cd medit
            cp index.html manifest.json sw.js package.json ../dist/medit/ 2>/dev/null || true
            cp -r js css icons audio ../dist/medit/ 2>/dev/null || true
            cd ..
          fi

          # Sanz Copy
          if [ -d "sanz" ]; then
            echo "Packaging Sanz..."
            cd sanz
            cp *.html favicon* apple-touch-icon.png jquery-1.11.2.min.js .nojekyll package.json ../dist/sanz/ 2>/dev/null || true
            cp -r files uploads apps ../dist/sanz/ 2>/dev/null || true
            cd ..
          fi

          # MenuM Copy
          if [ -d "menum" ]; then
            echo "Packaging MenuM..."
            cd menum
            cp index.html manifest.json sw.js package.json ../dist/menum/ 2>/dev/null || true
            cp -r data css js icons ../dist/menum/ 2>/dev/null || true
            cd ..
          fi

          # Agenda Murcia Copy
          if [ -d "agendamurcia" ]; then
            echo "Packaging Agenda Murcia..."
            mkdir -p dist/agendamurcia
            cp agendamurcia/index.html agendamurcia/events.json agendamurcia/events.js agendamurcia/favicon.svg dist/agendamurcia/ 2>/dev/null || true
            touch dist/agendamurcia/.nojekyll
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
