name: Update Weather Forecast

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fetch AEMET Data
      env:
        AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      working-directory: murmeteo
      run: node fetch-aemet.js

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add murmeteo/forecast.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar pronóstico AEMET" && git push)
