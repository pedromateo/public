name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: Install dependencies
        working-directory: brainfit
        run: npm install
        
      - name: Run Tests
        working-directory: brainfit
        run: npm run test

      - name: Prepare production build
        working-directory: brainfit
        run: |
          mkdir -p dist/brainfit
          sed -i "s/brainfit-cache-v1/brainfit-cache-${{ github.sha }}/g" sw.js
          cp index.html manifest.json sw.js config.json dist/brainfit/
          cp -r css js assets dist/brainfit/
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './brainfit/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
