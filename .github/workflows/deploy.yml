name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'brainfit/**'
      - 'murmeteo/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: Test Brainfit
        if: hashFiles('brainfit/package.json') != ''
        working-directory: brainfit
        run: |
          npm install
          npm run test || true

      - name: Test MurMeteo
        if: hashFiles('murmeteo/package.json') != ''
        working-directory: murmeteo
        run: |
          npm run test
          
      - name: Prepare production build
        run: |
          mkdir -p dist/brainfit dist/murmeteo
          
          # Brainfit Build
          if [ -d "brainfit" ]; then
            echo "Packaging Brainfit..."
            cd brainfit
            sed -i "s/brainfit-cache-v1/brainfit-cache-${{ github.sha }}/g" sw.js || true
            cp index.html manifest.json sw.js config.json ../dist/brainfit/ || true
            cp -r css js assets ../dist/brainfit/ || true
            cd ..
          fi
          
          # MurMeteo Build
          if [ -d "murmeteo" ]; then
            echo "Packaging MurMeteo..."
            cd murmeteo
            sed -i "s/murmeteo-static-v[0-9]*/murmeteo-static-${{ github.sha }}/g" sw.js || true
            cp index.html manifest.json sw.js config.json aemetService.js app.js style.css package.json ../dist/murmeteo/ || true
            cp -f icon-192.png icon-512.png logo.png ../dist/murmeteo/ || true
            cd ..
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
