name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'brainfit/**'
      - 'murmeteo/**'
      - 'loopp/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Filter modified paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            brainfit:
              - 'brainfit/**'
            murmeteo:
              - 'murmeteo/**'
            loopp:
              - 'loopp/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: Test Brainfit
        if: (steps.filter.outputs.brainfit == 'true' || steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch') && hashFiles('brainfit/package.json') != ''
        working-directory: brainfit
        run: |
          npm install
          npm run test || true

      - name: Test MurMeteo
        if: (steps.filter.outputs.murmeteo == 'true' || steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch') && hashFiles('murmeteo/package.json') != ''
        working-directory: murmeteo
        run: |
          npm run test
          
      - name: Test Loopp
        if: (steps.filter.outputs.loopp == 'true' || steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch') && hashFiles('loopp/package.json') != ''
        working-directory: loopp
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run test

      - name: Prepare production build
        run: |
          mkdir -p dist/brainfit dist/murmeteo dist/loopp
          
          # Brainfit Build
          if [ -d "brainfit" ]; then
            echo "Packaging Brainfit..."
            cd brainfit
            sed -i "s/brainfit-cache-v1/brainfit-cache-${{ github.sha }}/g" sw.js || true
            cp index.html manifest.json sw.js config.json ../dist/brainfit/ || true
            cp -r css js assets ../dist/brainfit/ || true
            cd ..
          fi
          
          # MurMeteo Build
          if [ -d "murmeteo" ]; then
            echo "Packaging MurMeteo..."
            cd murmeteo
            sed -i "s/murmeteo-static-v[0-9]*/murmeteo-static-${{ github.sha }}/g" sw.js || true
            cp index.html manifest.json sw.js config.json aemetService.js app.js style.css package.json ../dist/murmeteo/ || true
            cp -r icons ../dist/murmeteo/ || true
            cp -f forecast.json ../dist/murmeteo/ || true
            cd ..
          fi

          # Loopp Build
          if [ -d "loopp" ]; then
            echo "Packaging Loopp..."
            cd loopp
            sed -i "s/looper-cache-v1/looper-cache-${{ github.sha }}/g" sw.js || true
            cp index.html manifest.json sw.js ../dist/loopp/ || true
            cp -r js icons ../dist/loopp/ || true
            cd ..
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
