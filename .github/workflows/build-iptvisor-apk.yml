name: Build IPTVisor APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'iptvisor/**'
      - '.github/workflows/build-iptvisor-apk.yml'
  workflow_dispatch:

concurrency:
  group: "iptvisor-build"
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and lint
        working-directory: iptvisor
        run: gradle testDebugUnitTest lintDebug --stacktrace

      - name: Build signed Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: iptvisor
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          export KEYSTORE_FILE="$PWD/release.jks"
          gradle assembleRelease --stacktrace

      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: iptvisor-release-apk
          path: iptvisor/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build Debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        working-directory: iptvisor
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: iptvisor-debug-apk
          path: iptvisor/app/build/outputs/apk/debug/*.apk
          retention-days: 30
