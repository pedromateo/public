name: Deploy MyLanding

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mylanding/**'
      - '.github/workflows/deploy-mylanding.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production build
        run: |
          mkdir -p dist/brainfit dist/murmeteo dist/loopp dist/mylanding

          # Brainfit Copy
          if [ -d "brainfit" ]; then
            echo "Packaging Brainfit..."
            cd brainfit
            cp index.html manifest.json sw.js config.json ../dist/brainfit/ || true
            cp -r css js assets ../dist/brainfit/ || true
            cd ..
          fi

          # MurMeteo Copy
          if [ -d "murmeteo" ]; then
            echo "Packaging MurMeteo..."
            cd murmeteo
            cp index.html manifest.json sw.js config.json aemetService.js app.js style.css package.json ../dist/murmeteo/ || true
            cp -r icons ../dist/murmeteo/ || true
            cp -f forecast.json ../dist/murmeteo/ || true
            cp -r forecasts ../dist/murmeteo/ || true
            cd ..
          fi

          # Loopp Copy
          if [ -d "loopp" ]; then
            echo "Packaging Loopp..."
            cd loopp
            cp index.html manifest.json sw.js ../dist/loopp/ || true
            cp -r js icons ../dist/loopp/ || true
            cd ..
          fi

          # MyLanding Copy
          if [ -d "mylanding" ]; then
            echo "Packaging MyLanding..."
            cd mylanding
            cp index.html ../dist/mylanding/ || true
            cp -r index_files ../dist/mylanding/ || true
            cd ..
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
