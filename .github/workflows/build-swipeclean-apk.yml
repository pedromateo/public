name: Build SwipeClean APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'swipeclean/**'
      - '.github/workflows/build-swipeclean-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swipeclean-build"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: swipeclean
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: swipeclean
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build_log.txt

      - name: Build Debug APK
        working-directory: swipeclean
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build_log.txt

      - name: Publish Test Failure Diagnostics
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-debug-log
          name: "Test Debug Log"
          body: "Log de compilación y pruebas para diagnóstico"
          draft: false
          prerelease: true
          files: swipeclean/build_log.txt

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipeclean-debug-apk
          path: swipeclean/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-apk
          name: "SwipeClean APK (Última versión)"
          body: |
            APK compilada automáticamente por GitHub Actions.
            - Commit: `${{ github.sha }}`
            - Rama: `${{ github.ref_name }}`
            
            Puedes descargar e instalar el archivo `app-debug.apk` directamente en tu dispositivo Android.
          draft: false
          prerelease: false
          files: swipeclean/app/build/outputs/apk/debug/app-debug.apk
