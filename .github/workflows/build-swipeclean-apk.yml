name: Build SwipeClean APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'swipeclean/**'
      - '.github/workflows/build-swipeclean-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "swipeclean-build"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: swipeclean
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: swipeclean
        run: |
          ./gradlew testDebugUnitTest || {
            echo "================== TEST FAILURES =================="
            find app/build/test-results -type f -name "*.xml" -exec cat {} + 2>/dev/null || true
            exit 1
          }

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: swipeclean/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Build Debug APK
        working-directory: swipeclean
        run: ./gradlew assembleDebug

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipeclean-debug-apk
          path: swipeclean/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-apk
          name: "SwipeClean APK (Última versión)"
          body: |
            APK compilada automáticamente por GitHub Actions.
            - Commit: `${{ github.sha }}`
            - Rama: `${{ github.ref_name }}`
            
            Puedes descargar e instalar el archivo `app-debug.apk` directamente en tu dispositivo Android.
          draft: false
          prerelease: false
          files: swipeclean/app/build/outputs/apk/debug/app-debug.apk
