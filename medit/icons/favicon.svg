<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Dark Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#090d16" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)" />

  <!-- Outer Breath Ripple 1 -->
  <circle cx="256" cy="256" r="160" stroke="url(#zenGrad)" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Outer Breath Ripple 2 -->
  <circle cx="256" cy="256" r="120" stroke="url(#zenGrad)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Core Zen Symbol: Stylized Breathing Seed / Water Drop of Mindfulness -->
  <path d="M 256 140 C 290 200 340 260 340 310 C 340 356 302 390 256 390 C 210 390 172 356 172 310 C 172 260 222 200 256 140 Z" fill="url(#zenGrad)" />

  <!-- Center Pearl of Awareness -->
  <circle cx="256" cy="300" r="28" fill="#ffffff" fill-opacity="0.9" />
</svg>
